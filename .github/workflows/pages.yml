name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/test_thresholds.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - run: mkdir _site && cp -r index.html thresholds.js favicon.svg og-image.png fonts _site/
      # Stamp the script address with this commit so browsers never pair a new page with an old cached thresholds.js
      - run: sed -i "s#thresholds.js?v=dev#thresholds.js?v=${GITHUB_SHA::8}#" _site/index.html && grep -c "thresholds.js?v=${GITHUB_SHA::8}" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
